<ng-container *ngIf="serie">
  <mat-card>
    <a (click)="goToDetails()" style="cursor: pointer;">
      <img
        mat-card-image
        class="poster"
        [src]="imageUrl"
        [alt]="serie.name">

      <mat-card-content>
        <h2 class="movie-title">{{ serie.name }}</h2>
        <p class="movie-release_date">{{ serie.first_air_date | date:'yyyy' }}</p>
      </mat-card-content>
    </a>

    <button
      mat-icon-button
      class="favorite-button"
      (click)="toggleFavorite(); $event.stopPropagation()"
      [color]="isFavorite ? 'warn' : 'primary'"
      [matTooltip]="isFavorite ? 'Quitar de favoritos' : 'Añadir a favoritos'"
      [attr.aria-label]="isFavorite ? 'Quitar de favoritos' : 'Añadir a favoritos'">
      <mat-icon>{{ isFavorite ? 'favorite' : 'favorite_border' }}</mat-icon>
    </button>
  </mat-card>
</ng-container>
