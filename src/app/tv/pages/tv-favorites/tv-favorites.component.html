<h1 class="titulo-favoritos">Mis series favoritas</h1>

<mat-spinner
  *ngIf="loading"
  diameter="40"
  style="margin: 2rem auto; display: block">
</mat-spinner>

<div
  class="grid"
  *ngIf="!loading && favorites.length > 0">

  <div
    *ngFor="let serie of favorites"
    class="col-12 sm:col-6 md:col-4 lg:col-3 xl:col-2">

    <app-tv-card
      [serie]="serie"
      [isFavorite]="true"
      (favoriteChange)="onFavoriteChange(serie, $event)">
    </app-tv-card>

  </div>

</div>

<section *ngIf="!loading && favorites.length === 0" class="empty-state" aria-live="polite">
  <mat-icon aria-hidden="true">live_tv</mat-icon>
  <h2>Aún no tienes series favoritas</h2>
  <p>Guarda las series que quieras tener siempre a mano.</p>
</section>
