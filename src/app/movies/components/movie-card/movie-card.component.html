<ng-container *ngIf="movie">

  <mat-card style="position: relative">
    <a [routerLink]="['/movies/movie', movie.id]" style="cursor:pointer;">
      <img mat-card-image class="poster" [src]="getImageUrl(movie.poster_path)" alt="{{ movie.title }}" />
      <mat-card-content>
        <h2 class="movie-title">{{ movie.title }}</h2>

        <p class="movie-release_date">{{ movie.release_date.slice(0, 4) }}</p>


      </mat-card-content>
    </a>

    <button mat-icon-button
            class="favorite-button"
            (click)="toggleFavorite(); $event.stopPropagation()"
            [color]="isFavorite ? 'warn' : 'primary'"
            [matTooltip]="isFavorite ? 'Quitar de favoritos' : 'Añadir a favoritos'"
            [attr.aria-label]="isFavorite ? 'Quitar de favoritos' : 'Añadir a favoritos'">
      <mat-icon>{{ isFavorite ? 'favorite' : 'favorite_border' }}</mat-icon>
    </button>

  </mat-card>
</ng-container>
