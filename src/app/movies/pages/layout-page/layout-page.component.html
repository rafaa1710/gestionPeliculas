<mat-sidenav-container class="h-screen">

  <mat-sidenav #sidenav mode="side" class="w-16rem" [opened]="false">

    <div class="sidenav-content">

      <mat-toolbar class="menu-toolbar">
        Menú
      </mat-toolbar>

      <mat-nav-list>
        <mat-list-item
          *ngFor="let opcion of sidebarItems"
          [routerLink]="opcion.url"
          (click)="sidenav.close()">

          <mat-icon matListItemIcon>{{ opcion.icon }}</mat-icon>
          {{ opcion.label }}

        </mat-list-item>
      </mat-nav-list>

      <div class="app-version">
        <span>CineLog</span>
        <small>v1.0.0</small>
      </div>

    </div>

  </mat-sidenav>

  <mat-sidenav-content>

    <mat-toolbar
      color="primary"
      class="justify-content-between items-center px-4">

      <button
        mat-icon-button
        (click)="sidenav.toggle()">

        <mat-icon>menu</mat-icon>
      </button>

      <span class="text-lg font-bold">
        🎞️ CINELOG 🎞️
      </span>

      <div class="flex items-center align-items-center">

        <span class="text-base font-medium p-3">
          {{ nombrePublico }}
        </span>

        <mat-icon style="font-size: 25px; padding: 10px;">
          account_circle
        </mat-icon>

        <button
          mat-icon-button
          color="accent"
          (click)="logout()"
          matTooltip="Cerrar sesión"
          matTooltipPosition="below"
          [matTooltipShowDelay]="300"
          aria-label="Cerrar sesión">

          <mat-icon style="font-size: 28px;">
            logout
          </mat-icon>

        </button>

      </div>

    </mat-toolbar>

    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>

  </mat-sidenav-content>

</mat-sidenav-container>
