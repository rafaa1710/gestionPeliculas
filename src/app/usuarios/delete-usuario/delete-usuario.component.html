<form class="form-container">
  <h2 class="titulo">Eliminar Usuario</h2>

  <p class="mensaje">
    ¿Seguro que deseas eliminar el usuario seleccionado?
  </p>

  <div class="acciones">
    <button mat-raised-button color="warn" (click)="confirmDelete()">
      Eliminar
    </button>

    <button mat-button routerLink="/users">
      Cancelar
    </button>
  </div>
</form>
